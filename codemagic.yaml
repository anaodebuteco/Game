workflows:
  ios-sideload:
    name: Game iOS (IPA sem assinatura)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 26.6
      vars:
        GODOT_VERSION: "4.7.2"
        PRESET_NAME: "iOS"
        APP_NAME: "Game"
        EXPECTED_BUNDLE_ID: "com.ghostteam.game"
    scripts:
      - name: Conferir o preset antes de gastar minutos
        script: |
          set -euo pipefail
          grep -q '^application/bundle_identifier="com.ghostteam.game"' export_presets.cfg \
            || { echo "ERRO: bundle_identifier diferente de com.ghostteam.game"; exit 1; }
          grep -Eq '^application/app_store_team_id="[A-Z0-9]{10}"' export_presets.cfg \
            || { echo "ERRO: app_store_team_id vazio ou fora do formato (10 caracteres A-Z0-9)"; exit 1; }
          grep -q '^application/export_project_only=true' export_presets.cfg \
            || { echo "ERRO: marque 'Export Project Only' no preset iOS"; exit 1; }
          echo "Preset OK"

      - name: Instalar Godot e export templates da mesma versao
        script: |
          set -euo pipefail
          mkdir -p "$HOME/godot" && cd "$HOME/godot"
          BASE="https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable"
          curl -fL --retry 3 -o godot.zip "${BASE}&slug=macos.universal.zip&platform=macos.universal"
          curl -fL --retry 3 -o templates.tpz "${BASE}&slug=export_templates.tpz&platform=templates"
          unzip -q godot.zip
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATES_DIR"
          unzip -q templates.tpz -d tpz_tmp
          cp -R tpz_tmp/templates/. "$TEMPLATES_DIR/"
          ls "$TEMPLATES_DIR"
          GODOT_BIN="$HOME/godot/Godot.app/Contents/MacOS/Godot"
          "$GODOT_BIN" --version
          "$GODOT_BIN" --version | grep -q "^${GODOT_VERSION}\.stable" \
            || { echo "ERRO: versao da Godot diferente de ${GODOT_VERSION}"; exit 1; }

      - name: Importar recursos e exportar o projeto Xcode (headless)
        script: |
          set -euo pipefail
          GODOT_BIN="$HOME/godot/Godot.app/Contents/MacOS/Godot"
          "$GODOT_BIN" --headless --path . --import
          mkdir -p build/ios
          "$GODOT_BIN" --headless --path . --export-release "$PRESET_NAME" "build/ios/${APP_NAME}.ipa"
          echo "--- conteudo de build/ios ---"
          find build/ios -maxdepth 3 | head -n 50
          XCODEPROJ=$(find build/ios -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          test -n "$XCODEPROJ" || { echo "ERRO: .xcodeproj nao foi gerado"; exit 1; }
          echo "$XCODEPROJ" > build/xcodeproj_path.txt

      - name: Compilar sem assinatura (xcodebuild archive)
        script: |
          set -euo pipefail
          XCODEPROJ=$(cat build/xcodeproj_path.txt)
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)
          xcodebuild -list -project "$XCODEPROJ"
          xcodebuild archive \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Game.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Empacotar o .ipa e conferir o bundle id
        script: |
          set -euo pipefail
          APP_PATH=$(find build/Game.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP_PATH" || { echo "ERRO: .app nao encontrado no xcarchive"; exit 1; }
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "Bundle ID no app: $BUNDLE_ID"
          [ "$BUNDLE_ID" = "$EXPECTED_BUNDLE_ID" ] || { echo "ERRO: bundle id inesperado"; exit 1; }
          rm -rf build/Payload build/out
          mkdir -p build/Payload build/out
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry "out/${APP_NAME}-unsigned.ipa" Payload)
          unzip -l "build/out/${APP_NAME}-unsigned.ipa" | head -n 15
    artifacts:
      - build/out/*.ipa